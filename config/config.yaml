paths:
  docs: "data/docs"
  chroma_db: "data/chroma_db"
  bm25_index: "data/bm25_index"
  manifest: "data/manifest.json"
  prompts: "config/prompts"
  eval_results: "data/eval/results"

ingestion:
  chunk_size: 800
  chunk_overlap: 150
  min_chunk_size: 100
  supported_extensions:
    - ".pdf"
    - ".ipynb"

embedding:
  model: "BAAI/bge-m3"
  batch_size: 32
  device: "cuda"
  normalize: true

retrieval:
  dense_top_k: 20
  final_top_k: 5
  collection_name: "course_docs"

generation:
  base_url: "http://localhost:1234/v1"
  model: "openai/gpt-oss-20b"
  api_key: "lm-studio"
  temperature: 0.1
  max_tokens: 2048
  reasoning_effort: "medium"

logging:
  level: "INFO"
