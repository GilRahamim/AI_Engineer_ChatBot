paths:
  docs: "data/docs"
  chroma_db: "data/chroma_db"
  bm25_index: "data/bm25_index"
  manifest: "data/manifest.json"
  prompts: "config/prompts"
  eval_results: "data/eval/results"
  cards: "summaries/cards"

ingestion:
  chunk_size: 800
  chunk_overlap: 150
  min_chunk_size: 100
  supported_extensions:
    - ".pdf"
    - ".ipynb"
  notebook_output_max_lines: 20  # longer cell outputs (training logs) keep head + tail only
  notebook_output_max_chars: 2000
  warn_chunks_per_file: 500      # warn when one file yields more chunks than this

embedding:
  model: "BAAI/bge-m3"
  batch_size: 32
  device: "cuda"                 # "cpu" frees ~1.5GB VRAM for a larger LLM
  normalize: true
  max_length: 512

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  collection_name: "course_docs"
  fusion:
    k: 60
    top_n: 20
  reranker:
    enabled: true
    model: "BAAI/bge-reranker-v2-m3"
    top_n: 8
    device: "cuda"               # "cpu" frees ~0.6GB VRAM; slower but fine for ~20 pairs
  hyde:
    enabled: true

generation:
  base_url: "http://localhost:1234/v1"
  model: "qwen/qwen3.6-35b-a3b"
  api_key: "lm-studio"
  temperature: 0.1
  # Sampling: null = server default. Set these from the model card when switching models.
  top_p: null
  top_k: null
  min_p: null
  presence_penalty: null
  max_tokens: 2048               # includes reasoning tokens on reasoning models
  task_max_tokens: {}            # per-task override, e.g. {summary: 6000, glossary: 8000}
  reasoning_effort: "medium"
